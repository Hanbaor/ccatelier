# Nijika extends Redefine 2.9.0. Template overrides live in custom/redefine/.
info:
  title: CC Atelier
  author: CC
  url: https://ccatelier.top
colors:
  primary: '#ecda7a'
  secondary: '#d77e70'
  default_mode: dark
defaults:
  favicon: /atelier/images/favicon.svg
global:
  single_page: false
  website_counter:
    enable: false
  preloader:
    enable: false
  open_graph:
    enable: true
    image: /atelier/images/ep05-3.jpg
  google_analytics:
    enable: false
home_banner:
  enable: false
  subtitle:
    text: []
home:
  sidebar:
    enable: false
navbar:
  search:
    enable: true
articles:
  style:
    font_size: 16px
    line_height: 2
    image_caption: true
    link_icon: false
    delete_mask: false
  toc:
    enable: true
    max_depth: 3
    number: false
  code_block:
    copy: true
    style: simple
    highlight_theme:
      light: github
      dark: tokyo-night-dark
  word_count:
    enable: false
  copyright:
    enable: true
    default: cc_by_nc_sa
  lazyload: false
comment:
  enable: false
footer:
  runtime: false
  statistics: false
plugins:
  feed:
    enable: false
  aplayer:
    enable: false
cdn:
  enable: false
inject:
  enable: false
nijika:
  github: https://github.com/Hanbaor
  repository: https://github.com/Hanbaor/ccatelier
  cover: /atelier/images/v3/hero.webp
  cover_day: /atelier/images/v2/hero.webp
  reading_art: /atelier/images/v2/notes.webp
  studio_art: /atelier/images/v3/hero.webp
  pixel_art: /atelier/images/v2/stage.webp
  stage: /atelier/images/v2/stage.webp
  portrait: /atelier/images/nijika.png
  aftershow: /atelier/images/v2/lounge.webp
  lounge_art: /atelier/images/v2/lounge.webp
  motion: true
  cursor: true
